.ko{margin-top:6px;color:#374151}.blur{filter:blur(6px)}

.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:#0f766e;color:#fff;font-size:16px;font-weight:700;margin-top:8px}
.btn.g{background:#e5e7eb;color:#111}.btn.r{background:#ef4444}.btn.y{background:#f59e0b}

.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.heat i{aspect-ratio:1;border-radius:4px;background:#e5e7eb}

const ITEMS=[];D.forEach(s=>{s.items=[];
s.p.forEach((x,i)=>{const[sp,j,r,k]=x.split("|");const it={id:s.id+"-p"+i,sec:s.id,type:"p",sp,j,r:r||j,k};s.items.push(it);ITEMS.push(it)});

const byId=id=>ITEMS.find(i=>i.id===id),$=id=>document.getElementById(id);

const save=()=>localStorage.setItem("tj1",JSON.stringify(S));
const ds=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const T=()=>ds(new Date());const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ds(d)};
const P=id=>S.prog[id]||(S.prog[id]={});const IV=[1,3,7,14,30];
const logAct=()=>{S.log[T()]=(S.log[T()]||0)+1;save()};
const hira=s=>s.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
let V={v:"home",sec:null,tab:"p"},R=null,Q={sec:null},TR={sec:null};
function speak(id,rate){const it=byId(id);speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(it.r);u.lang="ja-JP";
const v=speechSynthesis.getVoices().find(v=>v.lang.replace("_","-").startsWith("ja"));if(v)u.voice=v;u.rate=rate||S.set.rate;speechSynthesis.speak(u);logAct()}

function learn(id,b){const p=P(id);p.learned=!p.learned;save();logAct();if(b)b.textContent=p.learned?"✅":"⬜"}
const due=()=>ITEMS.filter(i=>{const p=S.prog[i.id];return p&&p.star&&p.due&&p.due<=T()});
function spk(id){$("r-"+id).innerHTML=`<div class="say"><input id="in-${id}" lang="ja" placeholder="🎤 듣는 중… (안 되면 키보드 마이크로)"><button onclick="cmp('${id}')">채점</button></div><div id="sc-${id}"></div>`;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("in-"+id).placeholder="일본어 키보드 🎤 받아쓰기로 말해 보세요";return}
try{const r=new SR();r.lang="ja-JP";r.onresult=e=>{$("in-"+id).value=e.results[0][0].transcript;cmp(id)};
r.onerror=()=>{$("in-"+id).placeholder="일본어 키보드 🎤 받아쓰기로 말해 보세요"};r.start()}catch(e){}}
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
function cmp(id){const it=byId(id),n=s=>hira(s).replace(/[、。,.?？!！\s・ー]/g,""),a=n($("in-"+id).value);if(!a)return;
const sc=Math.round(Math.max(...[it.j,it.r].map(t=>{const b=n(t);return 1-lev(a,b)/Math.max(a.length,b.length)}))*100);
let msg=sc>=85?"🎉 완벽해요!":sc>=60?"👍 거의 다 왔어요":"🔁 다시 들어볼까요? (복습함에 추가됨)";
if(sc<60){const p=P(id);p.star=true;p.due=T();p.box=0;p.ng=(p.ng||0)+1}logAct();$("sc-"+id).innerHTML=`<p><b>${sc}%</b> ${msg}</p>`}
function card(it){const p=S.prog[it.id]||{};return `<div class="card ${it.sp==="S"?"staff":""}">
<div class="lab">${it.type==="w"?"📘 단어":it.sp==="S"?"🧑‍💼 상대가 하는 말":"🙋 내가 하는 말"}</div><div class="jp">${it.j}</div>
${S.set.read&&it.r!==it.j?`<div class="rd">${S.set.hira?hira(it.r):it.r}</div>`:S.set.read&&S.set.hira&&hira(it.j)!==it.j?`<div class="rd">${hira(it.j)}</div>`:""}
<div class="ko ${S.set.hideKo?"blur":""}" onclick="this.classList.toggle('blur')">${it.k}</div>
<div class="btns"><button onclick="speak('${it.id}')">🔊</button><button onclick="speak('${it.id}',0.55)">🐢</button>
<button onclick="spk('${it.id}')">🎤</button><button onclick="star('${it.id}',this)">${p.star?"⭐":"☆"}</button>
<button onclick="learn('${it.id}',this)">${p.learned?"✅":"⬜"}</button></div><div id="r-${it.id}"></div></div>`}
const pct=s=>Math.round(s.items.filter(i=>(S.prog[i.id]||{}).learned).length/s.items.length*100);
function streak(){let n=0,d=new Date();if(!S.log[ds(d)])d.setDate(d.getDate()-1);while(S.log[ds(d)]){n++;d.setDate(d.getDate()-1)}return n}
const V_={
home(){const t=new Date();t.setHours(0,0,0,0);const dd=Math.round((TRIP-t)/864e5);
return `<div class="box"><b>🗾 다카마쓰 여행 ${dd>0?"D-"+dd:dd===0?"D-DAY!":"다녀오셨네요!"}</b> <small>12/7~12/10</small></div>
<div class="box row"><div class="stat"><b>🔥${streak()}</b>연속일</div><div class="stat"><b>${S.log[T()]||0}</b>오늘 학습</div><div class="stat"><b>${due().length}</b>오늘 복습</div></div>
${due().length?`<button class="btn y" onclick="go('review')">⭐ 오늘 복습 ${due().length}개 시작</button><br>`:""}
<div class="grid">${D.map(s=>`<div class="sec" onclick="go('sec','${s.id}')"><div class="ic">${s.ic}</div><b>${s.t}</b><div class="bar"><i style="width:${pct(s)}%"></i></div><small>${pct(s)}%</small></div>`).join("")}</div>`},
sec(){const s=D.find(x=>x.id===V.sec);return `<button class="btn g" onclick="go('home')">← 섹션 목록</button><h2>${s.ic} ${s.t}</h2>
<div class="tabs"><button class="${V.tab==="p"?"on":""}" onclick="V.tab='p';render()">문장</button><button class="${V.tab==="w"?"on":""}" onclick="V.tab='w';render()">단어</button></div>
${s.items.filter(i=>i.type===V.tab).map(card).join("")}`},
review(){if(!R||R.done){R={list:due(),i:0,show:false}}const it=R.list[R.i];
if(!it){R.done=true;const st=ITEMS.filter(i=>(S.prog[i.id]||{}).star);return `<div class="box"><b>🎉 오늘 복습 끝!</b></div><h3>⭐ 체크한 전체 (${st.length})</h3>${st.map(card).join("")||"<p>아직 없어요. 어려운 문장에 ☆를 눌러 보세요.</p>"}`}
return `<div class="box"><small>${R.i+1} / ${R.list.length}</small><div class="big">${it.j}</div>
${R.show?`<div class="rd">${hira(it.r)}</div><p>${it.k}</p>`:""}<button class="btn g" onclick="speak('${it.id}')">🔊 듣기</button>
${R.show?`<div class="row"><button class="btn r" style="flex:1" onclick="grade(0)">모름</button><button class="btn y" style="flex:1" onclick="grade(1)">애매</button><button class="btn" style="flex:1" onclick="grade(2)">앎</button></div>`
:`<button class="btn" onclick="R.show=true;render()">뜻 보기</button>`}</div>`},
quiz(){return `${chips("Q")}${Q.it?`<div class="box"><p>🎧 듣고 뜻을 고르세요</p><button class="btn g" onclick="speak('${Q.it.id}')">🔊 다시 듣기</button>
<button class="btn g" onclick="speak('${Q.it.id}',0.55)">🐢 느리게</button>
${Q.res?`<p class="big">${Q.it.j}</p><div class="rd">${hira(Q.it.r)}</div><p>${Q.res}</p>`:""}
${Q.opts.map(o=>`<button class="btn ${Q.res?(o===Q.it.k?"":"g"):"g"}" onclick="ans(this.textContent)">${o}</button>`).join("")}</div>`:""}
<button class="btn" onclick="newQ()">${Q.it?"다음 문제 ▶":"퀴즈 시작 ▶"}</button>`},
stats(){const lv=n=>!n?"#e5e7eb":n<10?"#99f6e4":n<30?"#2dd4bf":"#0f766e";let h="";for(let i=34;i>=0;i--){const d=addDays(-i);h+=`<i style="background:${lv(S.log[d])}" title="${d}"></i>`}
const wr=ITEMS.filter(i=>(S.prog[i.id]||{}).ng).sort((a,b)=>S.prog[b.id].ng-S.prog[a.id].ng).slice(0,5);
const ln=ITEMS.filter(i=>(S.prog[i.id]||{}).learned).length;
return `<div class="box row"><div class="stat"><b>🔥${streak()}</b>연속일</div><div class="stat"><b>${Object.keys(S.log).length}</b>학습한 날</div><div class="stat"><b>${ln}/${ITEMS.length}</b>익힘</div></div>
<div class="box"><b>최근 5주</b><div class="heat" style="margin-top:8px">${h}</div></div>
<div class="box"><b>섹션별 진척도</b>${D.map(s=>`<div style="margin-top:8px">${s.ic} ${s.t} ${pct(s)}%<div class="bar"><i style="width:${pct(s)}%"></i></div></div>`).join("")}</div>
${wr.length?`<div class="box"><b>자주 틀리는 문장</b>${wr.map(i=>`<p>${i.j} <small>(${S.prog[i.id].ng}회)</small></p>`).join("")}</div>`:""}
<div class="box set"><b>설정</b>
<label>읽기(후리가나) 표시<input type="checkbox" ${S.set.read?"checked":""} onchange="S.set.read=this.checked;save()"></label>
<label>가타카나 → 히라가나로 읽기 표시<input type="checkbox" ${S.set.hira?"checked":""} onchange="S.set.hira=this.checked;save()"></label>
<label>한국어 뜻 가리기(탭하면 보임)<input type="checkbox" ${S.set.hideKo?"checked":""} onchange="S.set.hideKo=this.checked;save()"></label>
<label>음성 속도 ${S.set.rate}<input type="range" min="0.5" max="1.2" step="0.1" value="${S.set.rate}" onchange="S.set.rate=+this.value;save();render()"></label>
<button class="btn g" onclick="exp()">📤 기록 백업(복사)</button><button class="btn g" onclick="imp()">📥 백업 불러오기</button></div>`},
travel(){const L=ITEMS.filter(i=>i.type==="p"&&i.sp==="M"&&(TR.sec?i.sec===TR.sec:(S.prog[i.id]||{}).star));
return `${chips("TR","⭐ 체크한 것")}<p><small>탭하면 소리가 나요. 화면을 직원에게 보여줘도 돼요.</small></p>
${L.map(i=>`<div class="box" onclick="speak('${i.id}')"><div class="big">${i.j}</div><small>${i.k}</small></div>`).join("")||"<p>⭐ 체크한 '내가 하는 말'이 없어요. 위에서 섹션을 골라 보세요.</p>"}`}};
function chips(k,first="전체"){const o=window[k]||(k==="Q"?Q:TR);return `<div class="chips"><button class="${!o.sec?"on":""}" onclick="${k}.sec=null;render()">${first}</button>${D.map(s=>`<button class="${o.sec===s.id?"on":""}" onclick="${k}.sec='${s.id}';render()">${s.ic} ${s.t}</button>`).join("")}</div>`}
function grade(g){const it=R.list[R.i],p=P(it.id);
if(g===0){p.box=0;p.due=addDays(1);p.ng=(p.ng||0)+1;R.list.push(it)}else if(g===1){p.due=addDays(IV[p.box||0])}
else{p.box=Math.min((p.box||0)+1,4);p.due=addDays(IV[p.box]);if(p.box>=3)p.learned=true}
logAct();R.i++;R.show=false;render()}
function newQ(){const pool=ITEMS.filter(i=>i.type==="p"&&(!Q.sec||i.sec===Q.sec));const it=pool[Math.floor(Math.random()*pool.length)];
const o=new Set([it.k]);while(o.size<4)o.add(ITEMS.filter(i=>i.type==="p")[Math.floor(Math.random()*ITEMS.filter(i=>i.type==="p").length)].k);
Q.it=it;Q.res=null;Q.opts=[...o].sort(()=>Math.random()-.5);render();speak(it.id)}
function ans(t){if(Q.res)return;const ok=t===Q.it.k;Q.res=ok?"⭕ 정답!":"❌ 오답 → 복습함에 추가됐어요";
if(!ok){const p=P(Q.it.id);p.star=true;p.due=T();p.box=0;p.ng=(p.ng||0)+1}logAct();render()}
function exp(){const t=JSON.stringify(S);navigator.clipboard.writeText(t).then(()=>alert("복사됐어요! 메모 앱에 붙여넣어 보관하세요."),()=>prompt("아래 내용을 복사해 보관하세요",t))}
function imp(){const t=prompt("백업 내용을 붙여넣으세요");if(!t)return;try{S=JSON.parse(t);save();alert("복원 완료");render()}catch(e){alert("형식이 올바르지 않아요")}}
const NAV=[["home","🏠","홈"],["review","⭐","복습"],["quiz","🎧","퀴즈"],["travel","🗣️","실전"],["stats","📊","기록"]];
function go(v,sec){V.v=v;if(sec){V.sec=sec;V.tab="p"}if(v==="review")R=null;render();scrollTo(0,0)}
function render(){$("app").innerHTML=V_[V.v]();$("nv").innerHTML=NAV.map(([k,i,t])=>`<button class="${V.v===k||(k==="home"&&V.v==="sec")?"on":""}" onclick="go('${k}')"><b>${i}</b>${t}</button>`).join("")}
speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{};render();
</script></body></html>
